name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest

  frontends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, parent-app]
    steps:
      - uses: actions/checkout@v4
      - name: Check for package.json
        id: check
        run: |
          if [ -f "${{ matrix.app }}/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }}/package.json not found, skipping"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "20"
      - name: Build
        if: steps.check.outputs.present == 'true'
        working-directory: ${{ matrix.app }}
        run: npm ci && npm run build
