# Saathi scenario for `ring-sandbox play` and sandbox/scenarios/play_day.py.
#
# Kamala's ordinary day. This is the routine the anomaly engine learns from
# (replay it for 14 days to backfill), so it should raise NO anomaly.
# offset_s is seconds after LOCAL MIDNIGHT (Asia/Kolkata) when played with
# play_day.py; plain `ring-sandbox play` keeps the spacing but ends "now".
# Devices are created by play_day.py: Front Door (doorbell), Kitchen Cam,
# Living Room Cam, Bedroom Cam.

name: normal_day
description: Kamala's ordinary day; wakes 06:50, kitchen by 07:40, bed at 21:50. No anomaly.
story_start: "00:00"   # scripts/demo_driver.py: offset_s counts from local midnight
check_at: "22:00"      # demo_driver forces a tick after the 21:00 digest time
