# Saathi scenario for `ring-sandbox play` and sandbox/scenarios/play_day.py.
#
# A normal day, plus a home aide who rings at 10:00, comes in, and leaves at
# 11:30. This is the 'expected visitor' contrast to scam_visitor: activity at
# the door during the day should NOT raise any routine anomaly.
# offset_s is seconds after LOCAL MIDNIGHT (Asia/Kolkata) with play_day.py.

name: aide_visit
description: Normal day plus a home aide visiting 10:00-11:30. No anomaly expected.
story_start: "00:00"   # scripts/demo_driver.py: offset_s counts from local midnight
steps:
  - offset_s: 24600   # 06:50 wakes up
    type: motion_detected
    sub_type: human
    device: Bedroom Cam
  - offset_s: 24900   # 06:55 takes in the milk
    type: motion_detected
    sub_type: human
    device: Front Door
  - offset_s: 27600   # 07:40 breakfast
    type: motion_detected
    sub_type: human
    device: Kitchen Cam
  - offset_s: 28800   # 08:00
    type: motion_detected
    sub_type: human
    device: Kitchen Cam
  - offset_s: 30000   # 08:20
    type: motion_detected
    sub_type: human
    device: Kitchen Cam
  - offset_s: 31500   # 08:45 living room through the morning
    type: motion_detected
    sub_type: human
    device: Living Room Cam
