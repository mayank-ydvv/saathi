# Saathi scenario for `ring-sandbox play` and sandbox/scenarios/play_day.py.
#
# A normal day, plus someone at the front door at 02:10 at night (Kamala
# wandering out, or an intruder). Expected anomaly: night_activity for the
# front_door zone (the 02:00-02:15 slot is active on <5% of learned days).
# offset_s is seconds after LOCAL MIDNIGHT (Asia/Kolkata) with play_day.py.

name: night_door
description: Normal day plus a person at the front door at 02:10. Triggers night_activity.
