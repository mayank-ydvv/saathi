# Saathi scenario for `ring-sandbox play` and sandbox/scenarios/play_day.py.
#
# Same as normal_day until lunch; the last movement is the living room at
# 13:00, then nothing for the rest of the day. Expected anomaly:
# long_inactivity (no motion anywhere for 4 hours while awake, ~17:00).
# offset_s is seconds after LOCAL MIDNIGHT (Asia/Kolkata) with play_day.py.

name: fall_day
description: Normal morning, last motion in the living room at 13:00, then silence. Triggers long_inactivity.
story_start: "00:00"   # scripts/demo_driver.py: offset_s counts from local midnight
check_at: "17:05"      # demo_driver forces a tick 4 h after the last motion (13:00)
steps:
  - offset_s: 24600   # 06:50 wakes up
    type: motion_detected
    sub_type: human
    device: Bedroom Cam
  - offset_s: 24900   # 06:55 takes in the milk
    type: motion_detected
    sub_type: human
    device: Front Door
  - offset_s: 27600   # 07:40 breakfast
    type: motion_detected
    sub_type: human
    device: Kitchen Cam
  - offset_s: 28800   # 08:00
    type: motion_detected
    sub_type: human
    device: Kitchen Cam
  - offset_s: 30000   # 08:20
    type: motion_detected
    sub_type: human
    device: Kitchen Cam
  - offset_s: 31500   # 08:45 living room through the morning
    type: motion_detected
    sub_type: human
    device: Living Room Cam
  - offset_s: 34200   # 09:30
    type: motion_detected
    sub_type: human
    device: Living Room Cam
  - offset_s: 36900   # 10:15
    type: motion_detected
    sub_type: human
    device: Living Room Cam
  - offset_s: 39600   # 11:00
    type: motion_detected
    sub_type: human
    device: Living Room Cam
  - offset_s: 42300   # 11:45
    type: motion_detected
    sub_type: human
    device: Living Room Cam
  - offset_s: 45900   # 12:45 starts lunch
    type: motion_detected
    sub_type: human
    device: Kitchen Cam
  - offset_s: 46800   # 13:00 last movement, then nothing
    type: motion_detected
    sub_type: human
    device: Living Room Cam
