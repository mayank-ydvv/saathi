# Saathi scenario for `ring-sandbox play` and sandbox/scenarios/play_day.py.
#
# A normal day, plus an unknown visitor at 15:10: a person walks up and rings
# the doorbell, but there is no package or vehicle (unlike a courier). The
# routine anomaly checks should stay quiet; the doorbell `ding` is what
# Krishnaditya's visitor description (Bedrock vision) inspects, and it should
# flag caution. The snapshot image itself comes from `serve --media-dir`.
# offset_s is seconds after LOCAL MIDNIGHT (Asia/Kolkata) with play_day.py.

name: scam_visitor
description: Normal day plus an unknown man ringing the doorbell at 15:10 with no package.
