[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "saathi"
version = "0.1.0"
description = "Elder-care guardian built on Ring: routine learning, anomaly alerts, escalation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "boto3>=1.34",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "mangum>=0.17",
    "ring-sandbox[server]>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "moto[dynamodb,s3]>=5.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dashboard", "parent-app"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
